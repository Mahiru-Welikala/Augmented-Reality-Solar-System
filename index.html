<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Solar System AR</title>

<!-- libs: A-Frame first, then AR.js -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<script>
  // ---------- 1. tap Earth or Earth button: next colour ----------
  AFRAME.registerComponent('color-changer', {
    schema: { button: { type: 'selector' } },
    init: function () {
      const colors = ['blue', 'red', 'yellow', 'green', 'pink', 'white'];
      let index = 0;
      const change = () => {
        index = (index + 1) % colors.length;   // next colour
        this.el.setAttribute('color', colors[index]);
      };
      this.el.addEventListener('click', change);        // tap planet
      this.data.button.addEventListener('click', change); // tap button
    }
  });

  // ---------- 2. tap Sun or Sun button: grow / shrink ----------
  AFRAME.registerComponent('grow-toggle', {
    schema: { button: { type: 'selector' } },
    init: function () {
      let big = false;
      const toggle = () => {
        big = !big;                            // flip size
        const size = big ? '1.5 1.5 1.5' : '1 1 1';
        this.el.setAttribute('animation__grow',
          'property: scale; to: ' + size + '; dur: 300; easing: easeOutQuad');
      };
      this.el.addEventListener('click', toggle);        // tap planet
      this.data.button.addEventListener('click', toggle); // tap button
    }
  });

  // ---------- 3. banner: marker found / lost ----------
  AFRAME.registerComponent('marker-status', {
    init: function () {
      const banner = document.querySelector('#status');
      this.el.addEventListener('markerFound', () => {
        banner.textContent = 'Marker FOUND - tap or click the Sun or Earth, or use the buttons below';
        banner.style.background = '#2E7D32';
      });
      this.el.addEventListener('markerLost', () => {
        banner.textContent = 'Marker LOST - point the camera at the Hiro marker';
        banner.style.background = '#C62828';
      });
    }
  });

  // ---------- 4. label: faces camera, sits above its planet ----------
  AFRAME.registerComponent('screen-label', {
    schema: {
      target: { type: 'selector' },            // planet to follow (none = stay put)
      offset: { default: 0.25 }                // gap above planet
    },
    init: function () {
      const T = AFRAME.THREE;
      this.pos = new T.Vector3();
      this.up = new T.Vector3();
      this.quat = new T.Quaternion();
    },
    tick: function () {
      const cam = this.el.sceneEl.camera;
      const obj = this.el.object3D;
      if (!cam || !obj.parent) return;
      if (this.data.target) {
        this.data.target.object3D.getWorldPosition(this.pos);
        obj.parent.worldToLocal(this.pos);                  // planet spot
        cam.getWorldQuaternion(this.quat);
        this.up.set(0, 1, 0).applyQuaternion(this.quat);    // screen up
        obj.parent.getWorldQuaternion(this.quat);
        this.up.applyQuaternion(this.quat.invert());
        obj.position.copy(this.pos).addScaledVector(this.up, this.data.offset);
      }
      cam.getWorldPosition(this.pos);
      obj.lookAt(this.pos);                                 // turn to camera
    }
  });
</script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }

  /* banner */
  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    padding: 12px; text-align: center; color: white;
    font: bold 14px sans-serif; background: #C62828;
    pointer-events: none;
  }

  /* buttons */
  #buttons {
    position: fixed; left: 0; right: 0; z-index: 999;
    bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 16px;
  }
  #buttons button {
    padding: 14px 20px; border: 0; border-radius: 12px;
    font: bold 16px sans-serif; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #sun-btn   { background: yellow; color: black; }
  #earth-btn { background: blue;   color: white; }
</style>
</head>

<body>
<div id="status">Looking for the Hiro marker...</div>

<div id="buttons">
  <button id="sun-btn">Sun: grow / shrink</button>
  <button id="earth-btn">Earth: colour</button>
</div>

<a-scene embedded vr-mode-ui="enabled: false"
         arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- files load first -->
  <a-assets timeout="20000">
    <a-asset-item id="rocket-model" src="rocket.glb"></a-asset-item>
  </a-assets>

  <a-marker preset="hiro" smooth="true" smoothCount="5" marker-status>

    <!-- space (black plate) -->
    <a-plane rotation="-90 0 0" width="2.8" height="1.8" color="black"></a-plane>

    <!-- title (black sign so it is easy to read) -->
    <a-entity position="-0.5 1.1 -1" screen-label>
      <a-plane width="1.5" height="0.32" color="black"></a-plane>
      <a-text value="Solar System" position="0 0 0.01" align="center"
              width="4" color="white"></a-text>
    </a-entity>

    <!-- solar system (centre of all orbits) -->
    <a-entity position="-0.5 0.3 0">

      <!-- sun (tap: grow) -->
      <a-sphere id="sun" class="clickable" grow-toggle="button: #sun-btn"
                radius="0.18" color="yellow"
                material="shader: flat"></a-sphere>

      <!-- orbit lines -->
      <a-ring rotation="-90 0 0" radius-inner="0.295" radius-outer="0.305" color="white"></a-ring>
      <a-ring rotation="-90 0 0" radius-inner="0.435" radius-outer="0.445" color="white"></a-ring>
      <a-ring rotation="-90 0 0" radius-inner="0.575" radius-outer="0.585" color="white"></a-ring>
      <a-ring rotation="-90 0 0" radius-inner="0.715" radius-outer="0.725" color="white"></a-ring>

      <!-- mercury: white, fast -->
      <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0;
                           dur: 6000; easing: linear; loop: true">
        <a-sphere position="0.3 0 0" radius="0.05" color="white"></a-sphere>
      </a-entity>

      <!-- venus: pink -->
      <a-entity animation="property: rotation; from: 0 90 0; to: 0 450 0;
                           dur: 9000; easing: linear; loop: true">
        <a-sphere position="0.44 0 0" radius="0.07" color="pink"></a-sphere>
      </a-entity>

      <!-- earth: blue (tap: colour) + moon (white box) -->
      <a-entity animation="property: rotation; from: 0 180 0; to: 0 540 0;
                           dur: 14000; easing: linear; loop: true">
        <a-sphere id="earth" color-changer="button: #earth-btn"
                  position="0.58 0 0" radius="0.1" color="blue">
          <!-- big invisible tap area (easier to tap) -->
          <a-sphere class="clickable" radius="0.22"
                    material="opacity: 0; transparent: true; depthWrite: false"></a-sphere>
        </a-sphere>
        <a-entity position="0.58 0 0"
                  animation="property: rotation; from: 0 0 0; to: 0 360 0;
                             dur: 3000; easing: linear; loop: true">
          <a-box position="0.15 0 0" width="0.05" height="0.05" depth="0.05" color="white"></a-box>
        </a-entity>
      </a-entity>

      <!-- mars: red -->
      <a-entity animation="property: rotation; from: 0 270 0; to: 0 630 0;
                           dur: 21000; easing: linear; loop: true">
        <a-sphere position="0.72 0 0" radius="0.07" color="red"></a-sphere>
      </a-entity>

    </a-entity>

    <!-- labels (sun + earth only) -->
    <a-entity screen-label="target: #sun; offset: 0.4">
      <a-plane width="0.3" height="0.13" color="black"></a-plane>
      <a-text value="SUN" position="0 0 0.01" align="center"
              width="1.7" color="white"></a-text>
    </a-entity>
    <a-entity screen-label="target: #earth; offset: 0.22">
      <a-plane width="0.36" height="0.13" color="black"></a-plane>
      <a-text value="EARTH" position="0 0 0.01" align="center"
              width="1.7" color="white"></a-text>
    </a-entity>

    <!-- rocket (glb), floats up and down -->
    <a-entity gltf-model="#rocket-model"
              position="1 0.4 0" rotation="0 -90 0" scale="0.4 0.4 0.4"
              animation="property: position; from: 1 0.4 0; to: 1 0.75 0;
                         dir: alternate; dur: 1800;
                         easing: easeInOutQuad; loop: true"></a-entity>

  </a-marker>

  <!-- camera + tap detection -->
  <a-entity camera
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .clickable"></a-entity>
</a-scene>
</body>
</html>
